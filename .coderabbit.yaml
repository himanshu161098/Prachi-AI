# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI Code Review & Security Configuration for Prachi AI
language: "en-US"
tone_instructions: "You are an expert full-stack engineer and security auditor reviewing Prachi AI. Focus on OWASP Top 10, authentication, multi-tenant isolation, JWT security, cryptographic safety, input sanitization, and performance."

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
    biome:
      enabled: true
  path_instructions:
    - path: "backend/src/routes/authRoutes.ts"
      instructions: "Ensure all authentication, OTP, and password operations use timing-safe equality and proper rate limiting. Verify mandatory identity verification before registration."
    - path: "backend/src/database/**"
      instructions: "Ensure no hardcoded credentials, check for ACID safety, and prevent data corruption in persistent storage."
    - path: "backend/src/utils/jwt.ts"
      instructions: "Ensure timing-safe signature comparison and enforce strict token expiration."
    - path: "backend/src/middleware/**"
      instructions: "Audit rate limiting, security headers (CSP, HSTS, X-Frame-Options), CORS policies, and sanitized error handling."

chat:
  auto_reply: true
